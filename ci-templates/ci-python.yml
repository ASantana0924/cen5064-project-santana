# CEN 5064 — CI for the PYTHON track
# In Session 4: copy this file to .github/workflows/ci.yml , commit, push,
# then open the Actions tab and watch it run. Green = your lint and tests pass.
#
# Assumes: requirements.txt at the repo root (create an empty one if you have no
# dependencies yet) and pytest-style tests (files named test_*.py).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
