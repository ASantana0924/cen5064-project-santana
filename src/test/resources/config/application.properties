# Test overrides, loaded on top of src/main/resources/application.properties.
# Every test runs against an in-memory H2 database in PostgreSQL mode, so
# `mvn verify` needs no Docker. Flyway runs the same V1__init.sql as the app.
# The random name gives each Spring test context its own empty database.
spring.datasource.url=jdbc:h2:mem:verifai-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
