# Number of different developers who must approve a task once all six checks pass.
verifai.approvals.required=2

# PostgreSQL connection. Each value can be set with an environment variable; the
# defaults match compose.yaml, so `docker compose up -d` is enough locally.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verifai}
spring.datasource.username=${DB_USERNAME:verifai}
spring.datasource.password=${DB_PASSWORD:verifai}

# Flyway creates and upgrades the schema from db/migration. Hibernate only
# checks that the entities match it and never changes it.
spring.jpa.hibernate.ddl-auto=validate
# Tasks are loaded and mapped inside the repository's transaction, so the
# session does not need to stay open while a request is handled.
spring.jpa.open-in-view=false
# Loads the parts of many tasks in a few queries when listing tasks.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
