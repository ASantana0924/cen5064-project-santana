<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks | VerifAI</title>
</head>
<body>
<h1>Tasks</h1>

<p th:if="${tasks.isEmpty()}">No tasks yet.</p>

<table th:unless="${tasks.isEmpty()}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Owner</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.title}">Title</td>
        <td th:text="${task.owner}">Owner</td>
        <td th:text="${task.status}">DRAFT</td>
    </tr>
    </tbody>
</table>
</body>
</html>
